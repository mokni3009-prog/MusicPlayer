name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Decode release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.p12
          echo "RELEASE_KEYSTORE_PATH=$PWD/release.p12" >> $GITHUB_ENV
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Guard gradient angles
        # Android GradientDrawable requires android:angle to be a multiple
        # of 45 — a bad angle (e.g. 165/150 in v1.0.2) crashes the app at
        # launch before the first frame. Fail the build instead.
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          bad = []
          for p in pathlib.Path('app/src/main/res/drawable').glob('*.xml'):
              for m in re.finditer(r'android:angle="(\d+)"', p.read_text()):
                  if int(m.group(1)) % 45 != 0:
                      bad.append(f"{p}: angle={m.group(1)}")
          if bad:
              print("INVALID GRADIENT ANGLES (must be multiples of 45):")
              print("\n".join(bad))
              sys.exit(1)
          print("All gradient angles are multiples of 45.")
          PY

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Rename APKs (ZenoPlay-v<version>-<abi>.apk)
        # The downloaded file must be named after the app + version, not
        # app-release.apk. The version is read from build.gradle.kts so
        # future releases are named automatically (e.g. ZenoPlay-v1.0.6.apk).
        # ABI splits produce one APK per architecture, so the ABI stays in
        # the name to keep the four files distinct.
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "version: $VERSION"
          for f in app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$f" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            mv "$f" "app/build/outputs/apk/release/ZenoPlay-v${VERSION}-${abi}.apk"
          done
          ls -l app/build/outputs/apk/release/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zeno-play-release-apks
          path: app/build/outputs/apk/release/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.13
          name: Zeno Play v1.0.13
          body: |
            Zeno Play v1.0.13 — the alarm is now a full alarm app inside the app (two apps in one), built on the approved design 3 + "Nouvelle alarme" sheet.

            - NEW (ALARME tab): a new ALARME tab in the library top bar (CHANSONS / ALBUMS / ARTISTES / PLAYLISTS / ALARME) opens the alarm app: a big live clock + date, a glowing "Prochaine alarme" card (time, name, "dans 8 h 15" countdown, on/off toggle) and a compact list of the other alarms. The + button opens the approved "Nouvelle alarme" sheet: big 07:00 time picker with chevrons, name, repeat days (Lun–Dim), song picker ("Choisir" opens the library), "Volume progressif" toggle, Annuler / Enregistrer. The same sheet edits an existing alarm (tap it) and deletes it ("Supprimer" with confirmation).
            - NEW (multiple alarms): as many alarms as wanted, each with its own time, name, repeat days (or once only), song and gradual volume, each with its own on/off toggle.
            - NEW (real alarm): when the time comes, a high-priority alarm notification appears (alarm name + song) with a clear "Arrêter" button and a full-screen ringing screen over the lock screen — and the chosen song plays, even with the app closed (exact AlarmManager alarm + foreground playback service; on Android 12+ the system exact-alarm permission is requested, with an inexact fallback). A one-time alarm disables itself after ringing; a repeating alarm re-schedules its next occurrence. Alarms survive a phone reboot (BOOT_COMPLETED re-schedules them). An old single alarm from v1.0.4–v1.0.12 is migrated automatically on first launch.
            - REMOVED: the alarm is gone from the settings tab entirely (the settings section title was updated too).

            Installs over v1.0.12 normally (same release key, no uninstall needed).
          files: app/build/outputs/apk/release/*.apk
