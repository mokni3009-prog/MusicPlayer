name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Decode release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.p12
          echo "RELEASE_KEYSTORE_PATH=$PWD/release.p12" >> $GITHUB_ENV
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Guard gradient angles
        # Android GradientDrawable requires android:angle to be a multiple
        # of 45 — a bad angle (e.g. 165/150 in v1.0.2) crashes the app at
        # launch before the first frame. Fail the build instead.
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          bad = []
          for p in pathlib.Path('app/src/main/res/drawable').glob('*.xml'):
              for m in re.finditer(r'android:angle="(\d+)"', p.read_text()):
                  if int(m.group(1)) % 45 != 0:
                      bad.append(f"{p}: angle={m.group(1)}")
          if bad:
              print("INVALID GRADIENT ANGLES (must be multiples of 45):")
              print("\n".join(bad))
              sys.exit(1)
          print("All gradient angles are multiples of 45.")
          PY

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Rename APKs (ZenoPlay-v<version>-<abi>.apk)
        # The downloaded file must be named after the app + version, not
        # app-release.apk. The version is read from build.gradle.kts so
        # future releases are named automatically (e.g. ZenoPlay-v1.0.6.apk).
        # ABI splits produce one APK per architecture, so the ABI stays in
        # the name to keep the four files distinct.
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "version: $VERSION"
          for f in app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$f" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            mv "$f" "app/build/outputs/apk/release/ZenoPlay-v${VERSION}-${abi}.apk"
          done
          ls -l app/build/outputs/apk/release/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zeno-play-release-apks
          path: app/build/outputs/apk/release/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.15
          name: Zeno Play v1.0.15
          body: |
            Zeno Play v1.0.15 — six fixes, no new features.

            - FIX (alarm + button): the ALARME tab said "touchez + pour en créer une" but there was no + button — the FAB sat behind the mini player whenever a song was loaded. It now floats above the mini player. And switching an enabled alarm off no longer makes it vanish from the screen (disabled alarms were hidden because only enabled ones were listed): off now only disables, the alarm stays in the list with its toggle off, and only the explicit delete action removes it.
            - FIX (full-player background): the blurred album-cover background only covered the middle of the screen — embedded covers are often landscape pictures with black letterbox bars, and plain centerCrop kept those bars. The cover is now pre-rendered to the exact screen size (black bars trimmed, centre-cropped with a safety zoom, blurred in software so it also works below API 31), so the background covers the whole screen edge-to-edge.
            - NEW (professional update dialogs, approved mockups): the plain system dialogs are replaced by Zeno-identity centred dialogs — "Nouvelle mise à jour" with the logo, title + gradient version badge and Installer / Plus tard buttons, and "Téléchargement de la mise à jour" with a circular gradient progress ring, percentage, downloaded / total sizes and an Annuler button (cancelling drops the partial file silently).
            - FIX (waves): the self-test "waves" check failed on v1.0.14 — the spectrum path is hardened (24/32-bit PCM support in the spectrum processor, the fallback rebuild now keeps audio offload disabled and resets the shared processors, effects are re-attached after a rebuild) and the probe now measures where the audio actually is (the old probe always started at position 0, where many clips open with a second or two of digital silence; the bar itself is unchanged).
            - FIX (self-test UI check): the check compared view bounds against the app-usable area, which excludes the navigation bar on Android 9, while the app runs force full-screen — the 5 root framework containers were always flagged. It now compares against the real screen size and skips window containers; the real checks (truncated text, clickable-but-disabled) are unchanged.

            Installs over v1.0.14 normally (same release key, no uninstall needed).
          files: app/build/outputs/apk/release/*.apk
