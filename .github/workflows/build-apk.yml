name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Decode release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.p12
          echo "RELEASE_KEYSTORE_PATH=$PWD/release.p12" >> $GITHUB_ENV
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Guard gradient angles
        # Android GradientDrawable requires android:angle to be a multiple
        # of 45 — a bad angle (e.g. 165/150 in v1.0.2) crashes the app at
        # launch before the first frame. Fail the build instead.
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          bad = []
          for p in pathlib.Path('app/src/main/res/drawable').glob('*.xml'):
              for m in re.finditer(r'android:angle="(\d+)"', p.read_text()):
                  if int(m.group(1)) % 45 != 0:
                      bad.append(f"{p}: angle={m.group(1)}")
          if bad:
              print("INVALID GRADIENT ANGLES (must be multiples of 45):")
              print("\n".join(bad))
              sys.exit(1)
          print("All gradient angles are multiples of 45.")
          PY

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Rename APKs (ZenoPlay-v<version>-<abi>.apk)
        # The downloaded file must be named after the app + version, not
        # app-release.apk. The version is read from build.gradle.kts so
        # future releases are named automatically (e.g. ZenoPlay-v1.0.6.apk).
        # ABI splits produce one APK per architecture, so the ABI stays in
        # the name to keep the four files distinct.
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "version: $VERSION"
          for f in app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$f" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            mv "$f" "app/build/outputs/apk/release/ZenoPlay-v${VERSION}-${abi}.apk"
          done
          ls -l app/build/outputs/apk/release/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zeno-play-release-apks
          path: app/build/outputs/apk/release/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.16
          name: Zeno Play v1.0.16
          body: |
            Zeno Play v1.0.16 — 8 new features + all 47 code-audit fixes.

            NEW (skip silence): silent parts in tracks (live recordings, podcasts) are skipped automatically — on/off in Settings, with a sensitivity choice (low / medium / high).

            NEW (3D surround / Virtualizer): spatial audio effect, on/off in Settings with an intensity choice (light / medium / strong). It attaches to the same audio session as the equalizer and reverb, so the EQ chain is untouched.

            NEW (auto-download missing covers): when a song or album has no cover, the app fetches it automatically from MusicBrainz / Cover Art Archive (iTunes as a fallback) and caches it on the device. Only cover images are fetched — no listening data is sent anywhere. Switchable off in Settings.

            NEW (star ratings 1–5 + smart playlist): rate the current song with the stars under the artist name in the full player (tap the current rating again to clear it). A new smart playlist "Les mieux notées" lists the songs rated 4 stars and up. Ratings are included in the backup.

            NEW (listening history): every track played is recorded (song + when) and shown in "Historique d'écoute" from Settings — tap an entry to play it again. The history never leaves the device.

            NEW (Auto-DJ): a button in the full player (Pro tools row) — when it is on, the app keeps the music going by itself, picking songs similar to the one just played (same artist, genre, album, category). Turning it on with an empty queue starts a random song.

            NEW (voice commands, Darija + Modern Standard Arabic): tap the microphone in the full player and say "شغّل", "وقّف", "التالي", "السابق", "شغّل أغنية…" or "زيد الصوت" — the phone's speech recognizer listens once (ar-TN, then ar as a fallback). The microphone permission is asked just-in-time with a clear explanation; Zeno Play records nothing. Note honestly: Darija recognition depends on the phone's speech service and is weaker than MSA.

            NEW (car mode, automatic): when the phone connects to the car's Bluetooth (car-audio device), the player switches to car mode by itself — big buttons, larger title, no distractions (tools row, lyrics and queue hidden). It returns to normal when the car disconnects. There is no manual button, by design.

            NOT BUILT (crossfade, honestly): a true crossfade needs two players overlapping with a MediaSession handoff, which conflicts with the app's single-player + single wave-chain architecture (and the VLC engine). A fade-out would have been a fake — so it was not built. The other eight features are in.

            FIXES (code audit, all 47): 4 critical — a stale queue index could crash the app (clamped now); the self-test "backup" check wrote to disk and could delete favorites (it now validates without writing); an alarm whose song was deleted from the library rang silently (it now posts a notification and plays the default tone); a widget action could freeze the app (the timeout no longer blocks the main thread). 13 major — saved queues work again, queue drag/swipe stays in sync, the tag editor / ringtone cutter / local lyrics / ReplayGain work on Android 10+ scoped storage, embedded lyrics display, the library loads off the main thread, cover loading cannot run out of memory, the blurred background renders off the main thread, the VLC engine race + unbounded cache are fixed, the alarm volume ramp cannot crash on rebuild, stopping a ringing alarm cannot fail silently, the Ken Burns animator no longer leaks, and volume boost / balance / Mono now work on 24/32-bit tracks. 30 minor — including French strings for the toasts, the unplayable MIDI chip removed, the lock-screen seek bar moves, the dead SettingsActivity removed from the manifest, and the updater closing its streams + verifying the download size.

            Installs over v1.0.15 normally (same release key, no uninstall needed).
          files: app/build/outputs/apk/release/*.apk
