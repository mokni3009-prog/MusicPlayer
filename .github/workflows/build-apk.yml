name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Decode release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.p12
          echo "RELEASE_KEYSTORE_PATH=$PWD/release.p12" >> $GITHUB_ENV
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Guard gradient angles
        # Android GradientDrawable requires android:angle to be a multiple
        # of 45 — a bad angle (e.g. 165/150 in v1.0.2) crashes the app at
        # launch before the first frame. Fail the build instead.
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          bad = []
          for p in pathlib.Path('app/src/main/res/drawable').glob('*.xml'):
              for m in re.finditer(r'android:angle="(\d+)"', p.read_text()):
                  if int(m.group(1)) % 45 != 0:
                      bad.append(f"{p}: angle={m.group(1)}")
          if bad:
              print("INVALID GRADIENT ANGLES (must be multiples of 45):")
              print("\n".join(bad))
              sys.exit(1)
          print("All gradient angles are multiples of 45.")
          PY

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Rename APKs (ZenoPlay-v<version>-<abi>.apk)
        # The downloaded file must be named after the app + version, not
        # app-release.apk. The version is read from build.gradle.kts so
        # future releases are named automatically (e.g. ZenoPlay-v1.0.6.apk).
        # ABI splits produce one APK per architecture, so the ABI stays in
        # the name to keep the four files distinct.
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "version: $VERSION"
          for f in app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$f" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            mv "$f" "app/build/outputs/apk/release/ZenoPlay-v${VERSION}-${abi}.apk"
          done
          ls -l app/build/outputs/apk/release/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zeno-play-release-apks
          path: app/build/outputs/apk/release/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.14
          name: Zeno Play v1.0.14
          body: |
            Zeno Play v1.0.14 — two bug fixes, no new features.

            - FIX (notification buttons): the previous / play-pause / next buttons in the playback notification now work even when the app UI is closed. They used to go through the activity's MediaController, which dies with the activity — the buttons are now handled directly by the playback service (same as the X button), using the service's own player + VLC engine. Failures are now reported to the error server instead of failing silently.
            - FIX (real 200% volume): the volume slider showed 200% but the sound stayed at 100% after any playback error. The fallback player rebuild used to build a plain player without the gain stage, so the boost gain was stored but never applied. The rebuild now uses the same spectrum + gain renderers factory as the normal player, so the 200% boost (+6 dB) survives any playback error. New self-test check "volume-boost" verifies it. Also fixed: cancelling the sleep timer mid-fade now restores full volume immediately (it used to stay lowered until the slider was moved).

            Installs over v1.0.13 normally (same release key, no uninstall needed).
          files: app/build/outputs/apk/release/*.apk
