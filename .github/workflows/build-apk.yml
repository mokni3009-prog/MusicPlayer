name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Decode release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.p12
          echo "RELEASE_KEYSTORE_PATH=$PWD/release.p12" >> $GITHUB_ENV
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Guard gradient angles
        # Android GradientDrawable requires android:angle to be a multiple
        # of 45 — a bad angle (e.g. 165/150 in v1.0.2) crashes the app at
        # launch before the first frame. Fail the build instead.
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          bad = []
          for p in pathlib.Path('app/src/main/res/drawable').glob('*.xml'):
              for m in re.finditer(r'android:angle="(\d+)"', p.read_text()):
                  if int(m.group(1)) % 45 != 0:
                      bad.append(f"{p}: angle={m.group(1)}")
          if bad:
              print("INVALID GRADIENT ANGLES (must be multiples of 45):")
              print("\n".join(bad))
              sys.exit(1)
          print("All gradient angles are multiples of 45.")
          PY

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Rename APKs (ZenoPlay-v<version>-<abi>.apk)
        # The downloaded file must be named after the app + version, not
        # app-release.apk. The version is read from build.gradle.kts so
        # future releases are named automatically (e.g. ZenoPlay-v1.0.5.apk).
        # ABI splits produce one APK per architecture, so the ABI stays in
        # the name to keep the four files distinct.
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "version: $VERSION"
          for f in app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$f" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            mv "$f" "app/build/outputs/apk/release/ZenoPlay-v${VERSION}-${abi}.apk"
          done
          ls -l app/build/outputs/apk/release/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zeno-play-release-apks
          path: app/build/outputs/apk/release/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4
          name: Zeno Play v1.0.4
          body: |
            Zeno Play v1.0.4 — release build (signed with the permanent release key).

            - NEW interface: the approved French redesign — tabs CHANSONS / ALBUMS / ARTISTES / PLAYLISTS / DOSSIERS / PARAMÈTRES, rotating circular cover, mini player, notification preview. App name on one line. "Gratuit pour toujours · Sans publicité · Vie privée respectée — pour toujours" on the splash (3 seconds, animated logo).
            - 24 features: no ads, uninterrupted playback, volume to 200% with BOOST, synced lyrics (LRCLIB, opt-in), Android Auto, folders + proper shuffle + reorderable queue, real 5-band EQ per output, batch tag editing, Gapless + ReplayGain + speed, all formats (Media3 + libVLC fallback, automatic), local backup + M3U, French/Arabic/English UI with Arabic/French metadata, live waves — now a circular smoke ring around the cover that breathes with the bass (the cover pulses with the beat), sleep timer, up to 20 saved queues, home-screen widget, smart playlists, listening stats, A–B repeat + play-once, ringtone cutter, AMOLED black, album-cover management, Chromecast (opt-in, off by default).
            - Privacy first: no account, no tracking, no ads, no extra permissions. Internet only for in-app updates, error reports and the optional lyrics/Chromecast.
            - The circular player now shows the song's REAL album cover; without a cover it shows the Zeno logo without any square frame. Same rule in the mini player and the song list.
            - Contact us on WhatsApp from the settings screen.
            - Four APKs (one per ABI) — download the one for your device (arm64-v8a for most phones); the in-app updater picks the right one automatically.

            Installs over v1.0.3 normally (same release key, no uninstall needed).
          files: app/build/outputs/apk/release/*.apk
