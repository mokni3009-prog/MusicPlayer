name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Decode release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.p12
          echo "RELEASE_KEYSTORE_PATH=$PWD/release.p12" >> $GITHUB_ENV
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Guard gradient angles
        # Android GradientDrawable requires android:angle to be a multiple
        # of 45 — a bad angle (e.g. 165/150 in v1.0.2) crashes the app at
        # launch before the first frame. Fail the build instead.
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          bad = []
          for p in pathlib.Path('app/src/main/res/drawable').glob('*.xml'):
              for m in re.finditer(r'android:angle="(\d+)"', p.read_text()):
                  if int(m.group(1)) % 45 != 0:
                      bad.append(f"{p}: angle={m.group(1)}")
          if bad:
              print("INVALID GRADIENT ANGLES (must be multiples of 45):")
              print("\n".join(bad))
              sys.exit(1)
          print("All gradient angles are multiples of 45.")
          PY

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Rename APKs (ZenoPlay-v<version>-<abi>.apk)
        # The downloaded file must be named after the app + version, not
        # app-release.apk. The version is read from build.gradle.kts so
        # future releases are named automatically (e.g. ZenoPlay-v1.0.6.apk).
        # ABI splits produce one APK per architecture, so the ABI stays in
        # the name to keep the four files distinct.
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "version: $VERSION"
          for f in app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$f" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            mv "$f" "app/build/outputs/apk/release/ZenoPlay-v${VERSION}-${abi}.apk"
          done
          ls -l app/build/outputs/apk/release/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zeno-play-release-apks
          path: app/build/outputs/apk/release/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.6
          name: Zeno Play v1.0.6
          body: |
            Zeno Play v1.0.6 — bugfix release (signed with the permanent release key).

            - FIXED: full-player crash on open (IllegalArgumentException: android:id/content is not a valid ancestor, in MaterialContainerTransform.createAnimator). Root cause: the shared view handed to the scene transition was the inner ImageView while the transitionName lived on its parent card, and neither activity set the MaterialContainerTransformSharedElementCallback the library requires. The launch now passes the card that carries the transitionName, both activities set the callback, and the transform itself is guarded so it can never crash the app again (the other shared-element motions still fly the cover). All 22 motion styles were audited — every animation resource and label exists and every path is guarded.
            - FIXED: volume slider barely changed the loudness (only 0% muted) and the 200% boost felt fake. The 0..100% range was linear amplitude (-6 dB at 50%), so it is now a perceptual square-law curve that feels graduated across the whole travel. The 200% boost used a plain tanh limiter that squashed loud tracks; it now has a knee limiter (linear below 0.9, rounded only above it), so 200% is a real +6 dB. The service also re-applies the slider volume when switching back from VLC to ExoPlayer and after a fallback player rebuild, where the setting used to be silently lost.
            - FIXED: Settings popups (sleep timer, waveform shape, motion type…) showed as plain grey Android boxes. Every popup menu and dialog in the app now uses the Zeno identity (dark navy background, gold accents, cream text, rounded corners) via the app theme.
            - CHANGED: the "free forever · no ads · privacy respected" line now appears ONLY on the splash screen; it was removed from the main header and from Settings. The splash itself is unchanged (3 seconds, animated logo, the three promises).
            - FIXED: in the full player, the repeat-one "1" badge hung below the repeat button, outside its bounds. It is now a small gold badge chip inside the button box (top-right corner), same on the Now Playing card.
            - No new features in this version.

            Installs over v1.0.5 normally (same release key, no uninstall needed).
          files: app/build/outputs/apk/release/*.apk
