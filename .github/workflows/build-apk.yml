name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Decode release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.p12
          echo "RELEASE_KEYSTORE_PATH=$PWD/release.p12" >> $GITHUB_ENV
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Guard gradient angles
        # Android GradientDrawable requires android:angle to be a multiple
        # of 45 — a bad angle (e.g. 165/150 in v1.0.2) crashes the app at
        # launch before the first frame. Fail the build instead.
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          bad = []
          for p in pathlib.Path('app/src/main/res/drawable').glob('*.xml'):
              for m in re.finditer(r'android:angle="(\d+)"', p.read_text()):
                  if int(m.group(1)) % 45 != 0:
                      bad.append(f"{p}: angle={m.group(1)}")
          if bad:
              print("INVALID GRADIENT ANGLES (must be multiples of 45):")
              print("\n".join(bad))
              sys.exit(1)
          print("All gradient angles are multiples of 45.")
          PY

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Rename APKs (ZenoPlay-v<version>-<abi>.apk)
        # The downloaded file must be named after the app + version, not
        # app-release.apk. The version is read from build.gradle.kts so
        # future releases are named automatically (e.g. ZenoPlay-v1.0.6.apk).
        # ABI splits produce one APK per architecture, so the ABI stays in
        # the name to keep the four files distinct.
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "version: $VERSION"
          for f in app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$f" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            mv "$f" "app/build/outputs/apk/release/ZenoPlay-v${VERSION}-${abi}.apk"
          done
          ls -l app/build/outputs/apk/release/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zeno-play-release-apks
          path: app/build/outputs/apk/release/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.10
          name: Zeno Play v1.0.10
          body: |
            Zeno Play v1.0.10 — simpler full player + notification controls. No new features; the full player keeps everything, only the layout changes.

            - NEW (full player): Standard / Pro modes. A small "Standard / Pro" toggle under the progress bar switches with one tap (light fade + slide animation). Standard (the default) shows only the essentials — cover, title, progress, previous/play/next/shuffle/repeat, volume, lyrics and the bottom action buttons. Pro reveals the advanced tools row (-10s, speed, A-B repeat, play once). The mode is saved and restored on every open.
            - CHANGED (full player): the "play once then next" button is now icon-only in Pro mode — a circular button with a next-arrow and a "1" badge, same size and style as the A, B, speed and -10s buttons. Same function; the text stays as the accessibility description.
            - NEW (notification): the playback notification now always shows four buttons — previous / play-pause / next / close (X) — on both engines. Before, the Media3 notification only added Next when the player reported a next item, so on the last song of a queue (or a single-song queue) it showed only Previous + Pause. The notification is now ongoing in both playing and paused states: it can never be swiped away — only the X button closes it. X stops playback, dismisses the notification and stops the foreground service cleanly (saved queue and resume position are untouched; pressing play again in the app restarts playback).

            Installs over v1.0.9 normally (same release key, no uninstall needed).
          files: app/build/outputs/apk/release/*.apk
